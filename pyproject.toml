[project]
name = "nursery"
version = "0.1.0"
description = "Local nursery rhyme video generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "mflux>=0.18.1",
    "diffusers>=0.39.0",
    "accelerate>=1.14.0",
]

[project.scripts]
nursery = "nursery.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nursery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
