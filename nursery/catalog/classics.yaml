# Public-domain nursery rhymes.
#
# Lyrics here are traditional and out of copyright. Melodies are given as note
# sequences and synthesized locally, so no recording or arrangement is copied.
# "Twinkle Twinkle" uses the tune of "Ah! vous dirai-je, maman" (1761), which is
# itself public domain.
#
# note syntax: "<NOTE><octave>:<beats>", r = rest. e.g. "C4:1", "r:0.5"

