      visual: three plump woolly sacks tied with ribbon beside a smiling sheep
    - text: One for the master, one for the dame
      visual: a cheerful farmer and a kind farm woman waving beside a red barn
    - text: And one for the little boy who lives down the lane
      visual: a happy small child carrying a wool sack along a winding country lane
