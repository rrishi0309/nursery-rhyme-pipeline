      visual: a sparkling diamond-shaped star glowing among swirling constellations
    - text: Twinkle, twinkle, little star
      visual: the smiling star surrounded by smaller cheerful stars in a purple sky
    - text: How I wonder what you are
      visual: the sleepy child tucked into bed, moonlight and stars through the window

baa-baa-black-sheep:
  title: Baa Baa Black Sheep
  style: >-
    children's storybook illustration, soft rounded shapes, bright cheerful
    colours, flat vector art with thick friendly outlines, sunny farm setting,
    no text
  tempo_bpm: 108
  melody:
